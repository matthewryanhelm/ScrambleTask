<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Anagram Task Prototype</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 {
      margin-bottom: 0.5rem;
    }

    #scramble {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    #instructions {
      margin-bottom: 1rem;
    }

    #board {
      margin-top: 1rem;
    }
    .attempt-row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
    }
    .letter-box {
      width: 2.4rem;
      height: 2.4rem;
      border: 2px solid #888;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      text-transform: uppercase;
      box-sizing: border-box;
    }
    .letter-box input {
      width: 100%;
      height: 100%;
      border: none;
      text-align: center;
      font-size: 1.4rem;
      text-transform: uppercase;
      outline: none;
      background: none;
    }
    .letter-box.readonly {
      background-color: #eee;
    }

    #message {
      margin-top: 0.5rem;
      color: #b00;
      min-height: 1.2rem;
    }

    #controls {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    button {
      font-size: 1rem;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }
    #skipBtn {
      display: none;  /* hidden until allowed */
    }
    #timer {
      margin-left: auto;
      font-size: 0.9rem;
      color: #555;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Anagram Task</h1>

  <div id="scramble"></div>
  <div id="instructions">
    Type your guess in the row of boxes and press Enter to submit. Work as quickly and accurately as you can.
  </div>

  <div id="board"></div>
  <div id="message"></div>

  <div id="controls">
    <button id="skipBtn">Skip this anagram</button>
    <div id="timer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
