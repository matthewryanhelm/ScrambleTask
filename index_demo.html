<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scramble Task</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    #instructions {
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }

    #scramble-row {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    #scramble {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    #timer {
      margin-left: auto;
      font-size: 0.9rem;
      color: #555;
      display: none; /* hides the timer from participants */
    }

    #board {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }

    .attempt-row {
      display: flex;
      justify-content: center;
      gap: 0.25rem;
    }

    .letter-box {
      width: 2.5rem;
      height: 2.5rem;
      border: 2px solid #999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      box-sizing: border-box;
    }

    .letter-box.readonly {
      background: #e5e5e5;
    }

    .letter-box input {
      width: 100%;
      height: 100%;
      border: none;
      text-align: center;
      font-size: 1.7rem;
      font-weight: bold;
      text-transform: uppercase;
      background: transparent;
      outline: none;
      padding: 0;
      margin: 0;
    }

    #message {
      min-height: 1.2rem;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: #b00;
    }

    #skipBtn {
      display: none;
      padding: 0.4rem 0.8rem;
      font-size: 0.9rem;
      border-radius: 4px;
      border: 2px solid #b00;
      color: b00;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
    }

    #controls {
      display: flex;
      justify-content: center;
      margin-bottom: 0.75rem;
    }

    /* On-screen keyboard */
    #keyboard {
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .kb-row {
      display: flex;
      margin: 0.15rem 0;
    }

    #keyboard button {
      min-width: 2.5rem;
      min-height: 2.5rem;
      padding: 0.4rem 0.3rem;
      margin: 0 0.08rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #bbb;
      background: #eee;
      cursor: pointer;
    }

    #keyboard button[data-key="ENTER"],
    #keyboard button[data-key="BACKSPACE"] {
      min-width: 5rem;
      font-size: 1rem;
    }

    #keyboard button:active {
      background: #ddd;
    }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .letter-box {
        width: 2.8rem;
        height: 2.8rem;
      }
      .letter-box input {
        font-size: 2rem;
      }
      #keyboard button {
        min-width: 2rem;
        padding: 0.35rem 0.25rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Scramble Task Demo</h1>
    

    <div id="instructions">
    <p><b>Instructions:</b> Type your guess in the boxes below and then press enter. Work as quickly and accurately as you can.</p>
    </div>

    <div id="scramble-row">
      <div id="scramble">Unscramble: ?????</div>
      <div id="timer">Time: 0s</div>
    </div>

    <div id="board"></div>

    <div id="message"></div>

    <div id="controls">
      <button id="skipBtn">Skip: I cannot solve this scramble.</button>
    </div>

    <!-- On-screen keyboard -->
    <div id="keyboard">
      <div class="kb-row">
        <button data-key="Q">Q</button>
        <button data-key="W">W</button>
        <button data-key="E">E</button>
        <button data-key="R">R</button>
        <button data-key="T">T</button>
        <button data-key="Y">Y</button>
        <button data-key="U">U</button>
        <button data-key="I">I</button>
        <button data-key="O">O</button>
        <button data-key="P">P</button>
      </div>
      <div class="kb-row">
        <button data-key="A">A</button>
        <button data-key="S">S</button>
        <button data-key="D">D</button>
        <button data-key="F">F</button>
        <button data-key="G">G</button>
        <button data-key="H">H</button>
        <button data-key="J">J</button>
        <button data-key="K">K</button>
        <button data-key="L">L</button>
      </div>
      <div class="kb-row">
        <button data-key="BACKSPACE">⌫</button>
        <button data-key="Z">Z</button>
        <button data-key="X">X</button>
        <button data-key="C">C</button>
        <button data-key="V">V</button>
        <button data-key="B">B</button>
        <button data-key="N">N</button>
        <button data-key="M">M</button>
        <button data-key="ENTER">Enter</button>
      </div>
    </div>
  </div>
<div class="container">
  <h3 style=color:darkblue;"><b>Note: You can advance to the real task by clicking the arrow at the bottom of the page.</b></h3>
</div>
  <script src="app_demo.js"></script>
</body>
</html>
